[project]
name = "agent-door-acp"
version = "0.1.0"
description = "ACP front door: forwards ACP frames between a WebSocket client and attendance."
requires-python = ">=3.12"
dependencies = ["starlette==1.6.0", "uvicorn==0.52.4", "websockets==17.2"]

[project.scripts]
agent-door-acp = "agent_door_acp.__main__:main"
# The stdio bridge for an ACP client that speaks stdio only.
creche-acp-connect = "agent_door_acp.connect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_door_acp"]

[tool.uv]
# uv rebuilds a local package only when pyproject.toml, setup.py or setup.cfg
# changes, and every first-party package stays at one version. Without the
# source in the key, a non-editable build installs the FIRST wheel uv ever
# cached for this directory, for ever, so a new commit's tree runs old code
# (handover/tests/test_handover_ced_uv_guard.py).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
