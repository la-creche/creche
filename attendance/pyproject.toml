[project]
name = "attendance"
version = "0.1.0"
description = "Session service: sessions, turns, journal, event streams (docs/rework/contracts/02, 03)."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
# The component's verify hook. `attendance/component.yaml` names it, and
# contract 06 §4 rule 6 says the hook ships inside this artifact.
attendance-verify = "attendance.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attendance"]


[tool.uv]
# uv rebuilds a local package only when pyproject.toml, setup.py or setup.cfg
# changes, and every first-party package stays at one version. Without the
# source in the key, a non-editable build installs the FIRST wheel uv ever
# cached for this directory, for ever, so a new commit's tree runs old code
# (release/tests/test_release_ced_uv_guard.py).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
