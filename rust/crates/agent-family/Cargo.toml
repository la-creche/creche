[package]
name = "agent-family"
description = "The validator of the family file and of the MCP server file, the registry loader and the agent-family program"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "agent-family"
path = "src/main.rs"

[dependencies]
creche-contracts = { path = "../creche-contracts" }
# The panic hook and the last boundary for a panic have one home, in the
# runtime crate. The program takes both from there and holds no copy of its
# own (rust/AGENTS.md, "The panic rule", clauses 3 and 7, and rule 13).
creche-runtime = { path = "../creche-runtime" }
creche-util = { path = "../creche-util" }

[dev-dependencies]
# The one reader of the vector files. The differential test reads through it
# (rust/AGENTS.md, "The differential test").
creche-vectors = { path = "../creche-vectors" }
serde_json = { workspace = true }
