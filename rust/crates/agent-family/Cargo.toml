[package]
name = "agent-family"
description = "The validator of the family file and of the MCP server file, the registry loader and the agent-family program"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "agent-family"
path = "src/main.rs"

[dependencies]
# The registry loader reads `family.toml` with the TOML reader of this
# dependency, so the crate names that feature itself.
creche-contracts = { path = "../creche-contracts", features = ["tomlfile"] }
# The program takes two functions from this dependency. `log::init` sets the
# panic hook. `service::enter` ends the program with status 1 after a panic.
# A copy of either one in this crate can drift from its source
# (rust/AGENTS.md, rule 13, and "The panic rule", clauses 3 and 7).
creche-runtime = { path = "../creche-runtime" }
creche-util = { path = "../creche-util" }

[dev-dependencies]
# The one reader of the vector files. The differential test reads through it
# (rust/AGENTS.md, "The differential test").
creche-vectors = { path = "../creche-vectors" }
serde_json = { workspace = true }
