[package]
name = "creche-contracts"
description = "The wire types and the config types of the creche contracts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
creche-util = { path = "../creche-util" }
serde = { workspace = true }
# `raw_value`: the session module reads a member of a body as its JSON text,
# so a number of any size and an unknown member cost no parse.
serde_json = { workspace = true, features = ["raw_value"] }
