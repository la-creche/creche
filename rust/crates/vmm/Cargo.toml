# The program `vmm`. One vmm process owns every Cloud Hypervisor VM of the
# playpen (decisions CH9, CH7-5). The library holds the host API server.
# main.rs only picks the mode.
[package]
name = "creche-vmm"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vmm"
path = "src/main.rs"

# Every path edge of the three vmm crates is declared here now, so a later
# change adds no lock entry for a path edge.
[dependencies]
creche-vmm-confine = { path = "../vmm-confine" }
creche-vmm-store = { path = "../vmm-store" }
creche-wire = { path = "../wire" }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# `net` for the UnixListener of vmm.sock and `sync` for the stop signal
# (decision CH26 rules 1 and 2). `time` for the pause after a failed accept
# and the read timeouts. hyper-util `tokio` turns it on already, so it adds
# no crate to the lock. `signal` for the SIGTERM that starts a clean stop
# (L19, decisions CH19 (4) and CH26 rule 2). It adds signal-hook-registry
# to the lock. `process` for the `git upload-pack` child of the 1103
# mirror serve: an async child with pipes and kill_on_drop (CH46 rule 4,
# CH67 rule 9). It adds no crate to the lock (CH9-1).
tokio = { workspace = true, features = ["net", "process", "signal", "sync", "time"] }

# `test-util` for paused time: a stop test checks the 30 s and 5 s waits
# of decision CH34 rule 5 with no real wait. It adds no crate to the lock.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
