[package]
name = "creche-runtime"
description = "The runtime that each Rust service of creche shares"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
creche-contracts = { path = "../creche-contracts" }
creche-util = { path = "../creche-util" }
axum = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustix = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

# The testkit depends on this crate, so a test inside src/ sees other types
# than the testkit does. AGENTS.md, rule 3, says where such a test goes.
[dev-dependencies]
creche-testkit = { path = "../creche-testkit" }
# A differential test compares a result with a value of a vector file. That
# value is a `serde_json::Value`, and a test helper names the type.
serde_json = { workspace = true }
