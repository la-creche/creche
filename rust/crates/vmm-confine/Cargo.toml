# The confinement of each Cloud Hypervisor process of the vmm: the launch
# step, the limits and the access rules. rust/crates/vmm/AGENTS.md has the
# table of the three vmm crates.
[package]
name = "creche-vmm-confine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
creche-vmm-store = { path = "../vmm-store" }
creche-wire = { path = "../wire" }
# `thread` adds `set_no_new_privs` for the launch stage (decision CH55).
# The feature adds no crate, so rust/Cargo.lock does not change.
rustix = { workspace = true, features = ["thread"] }
serde.workspace = true
serde_json.workspace = true

# The landlock crate builds only on Linux. A Linux-only entry keeps
# `cargo check --workspace` working on a macOS dev machine, so the code
# that calls it (C6) sits behind cfg(target_os = "linux") (decision CH38).
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[lints]
workspace = true
