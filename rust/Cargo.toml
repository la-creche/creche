# The Cargo workspace of this repository. rust/AGENTS.md holds the rules.
#
# Every Cargo file stays under rust/. The tag allocator
# (handover/src/handover/allocate.py, `touched`) gives a path under no
# component to no component, so a change here mints no tag and starts no
# release.

[workspace]
resolver = "3"
members = ["crates/*"]

# No `version` key: no number lives in a file (CONTRIBUTING.md, Tags and
# releases). Cargo reads a crate with no version as 0.0.0.
[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: serde_json then reads each JSON float as the nearest
# float, as Python does. Without it, a float of 16 digits or more can differ
# from the Python value in its last bit.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The one TOML parser and writer. Only the module `tomlfile` of
# creche-contracts names the two crates (rust/AGENTS.md, "TOML").
#
# No `preserve_order`: the crate then gives the keys of each table in sorted
# order, and its feature would add three crates to the build.
toml = { version = "1.1.8", default-features = false, features = [
    "std",
    "serde",
    "parse",
    "display",
] }
# The events of a TOML text, for the check that holds a text to TOML 1.0.
# `toml` brings this crate already.
toml_parser = { version = "1.1.5", default-features = false, features = ["std"] }

# The common stack of a service. creche-runtime uses each crate below, and
# rust/AGENTS.md, "The rules for a service", says how. Each entry turns the
# default features off and names each feature that the code needs. A feature
# that no code needs adds crates that no person here reviews.
#
# No TLS crate is here. The client of creche-runtime refuses an `https` URL.
tokio = { version = "1.53.2", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "signal",
    "time",
    "io-util",
    "sync",
] }
# `rt`: the tracker of the tasks that must end before the process exits.
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
# A service adds `json`, `query` or `form` in its own Cargo.toml when it
# needs one.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.5", default-features = false }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
# Two calls with no `unsafe` code here: a signal to a child program, and the
# open of a file that refuses a symlink and never blocks.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs"] }
# `util`: one call of a router with no socket. creche-testkit sends a test
# request in that way. The serve loop and the edge layer of creche-runtime
# give a request to the router of a service in that way. axum already holds
# this crate with this feature.
tower = { version = "0.5.3", default-features = false, features = ["util"] }

# The lint gate. A crate inherits it with `[lints] workspace = true`, and
# bin/rust-gate.sh refuses a crate that does not. An exception is written
# `#[expect(clippy::<lint>, reason = "...")]` at the one item, never
# `#[allow]`.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
# `warn`: the gate runs clippy with `-D warnings`, so this refuses a merge
# and does not stop a local `cargo build`.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
await_holding_lock = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
# The exception rule itself. An `#[allow]`, or an `#[expect]` with no reason,
# lifts any lint above for one item or for a whole crate, and no build says
# so.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# A panic unwinds, in each profile. The edge layer of creche-runtime then
# catches the panic of one request, and the process serves the next request.
# With `abort`, one panic stops the service.
#
# `overflow-checks`: an integer overflow panics in a release build too. Without
# it, a release build wraps the number and continues with a wrong value.
# bin/tests/test_rust_workspace.py pins the two profiles.
[profile.release]
panic = "unwind"
overflow-checks = true

[profile.dev]
panic = "unwind"
