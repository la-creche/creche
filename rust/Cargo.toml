# The Cargo workspace of this repository. It holds the programs that own
# the Cloud Hypervisor VMs of the playpen (the design note of the move,
# decision CH9).
#
# Every Cargo file stays under rust/. The tag allocator
# (handover/src/handover/allocate.py) gives a path under no component to no
# component, so a change here mints no tag and starts no release.

[workspace]
resolver = "3"
members = ["crates/*"]

# No `version` key: no number lives in a file (CONTRIBUTING.md). Cargo reads
# a crate with no version as 0.0.0.
[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

# Each entry turns the default features off and names each feature that the
# code needs. A feature that no code needs adds crates that no person here
# reviews.
[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# Only tests of creche-wire use it: a test writes the JSON Schema of the wire
# types, and the Python models are generated from that schema (decision
# CH9-1).
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }
# The async runtime of the vmm (decision CH26 rule 1). `rt-multi-thread`:
# the serve mode runs on the multi-thread runtime, so one stray blocking
# call cannot stall every relay. The PR that first needs a further feature
# adds it.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread"] }
# The HTTP/1.1 server of the vmm host API (decisions CH20, CH26). `server`
# and `http1` only: the vmm serves one Unix socket and owns its accept loop.
# The version is the one in chaperone's Cargo.lock (decision CH26).
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
# The tokio glue of hyper (decision CH26 rule 1). `tokio` only, for TokioIo.
# It also turns on the tokio feature `time`. The vmm owns its accept loop
# (decision CH26), so no `server-auto`. Shutdown uses tokio::sync (decision
# CH26 rule 2), so no `server-graceful`.
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# The body helpers of the vmm host API (decision CH26 rule 1): Limited for
# the 1 MiB body cap and Full for each reply. Both need no feature.
http-body-util = { version = "0.1.5", default-features = false }

# The lint gate. A crate inherits it with `[lints] workspace = true`. An
# exception is written `#[expect(clippy::<lint>, reason = "...")]` at the one
# item, never `#[allow]`.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
# `warn`: CI runs clippy with `-D warnings`, so this refuses a merge and does
# not stop a local `cargo build`.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
# The exception rule itself. An `#[allow]`, or an `#[expect]` with no reason,
# lifts any lint above with no trace in the build.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# `overflow-checks`: an integer overflow panics in a release build too.
# Without it, a release build wraps the number and continues with a wrong
# value.
[profile.release]
overflow-checks = true
