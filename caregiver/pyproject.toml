[project]
name = "caregiver"
version = "0.1.0"
description = "Family manager: converges each family to its file (docs/rework/contracts/01, 04, 05)."
requires-python = ">=3.12"
dependencies = ["agent-family", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
caregiver = "caregiver.cli:main"
# The component's verify hook. `caregiver/component.yaml` names it, and
# contract 06 §4 rule 6 says the hook ships inside this artifact.
caregiver-verify = "caregiver.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caregiver"]

[tool.uv.sources]
agent-family = { workspace = true }

[tool.uv]
# uv rebuilds a local package only when pyproject.toml, setup.py or setup.cfg
# changes, and every first-party package stays at one version. Without the
# source in the key, a non-editable build installs the FIRST wheel uv ever
# cached for this directory, for ever, so a new commit's tree runs old code
# (release/tests/test_release_ced_uv_guard.py).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
