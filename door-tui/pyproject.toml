[project]
name = "agent-door-tui"
version = "0.1.0"
description = "TUI front door: attach a terminal to a session (contract 02)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

# The program the operator types. `python -m agent_door_tui` is the same entry point.
[project.scripts]
agent-tui = "agent_door_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_door_tui"]

[tool.uv]
# uv rebuilds a local package only when pyproject.toml, setup.py or setup.cfg
# changes, and every first-party package stays at one version. Without the
# source in the key, a non-editable build installs the FIRST wheel uv ever
# cached for this directory, for ever, so a new commit's tree runs old code
# (handover/tests/test_handover_ced_uv_guard.py).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
