[project]
name = "agent-control-workspace"
# Frozen. No number lives in a file: a version is a `<component>-vX.Y.Z` tag
# that CI allocates at merge (.github/workflows/release.yml). uv needs the
# field to resolve the workspace, so it stays, and nothing reads it.
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "library",
    "agent-family",
    "caregiver",
    "attendance",
    "agent-door-trigger",
    "agent-door-acp",
    "noticeboard",
    "handover",
    "creche-env",
    "creche-wire",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["library", "family", "caregiver", "attendance", "door-trigger", "door-acp", "noticeboard", "handover", "env", "wire"]

[tool.uv.sources]
library = { workspace = true }
agent-family = { workspace = true }
caregiver = { workspace = true }
attendance = { workspace = true }
agent-door-trigger = { workspace = true }
agent-door-acp = { workspace = true }
noticeboard = { workspace = true }
handover = { workspace = true }
creche-env = { workspace = true }
creche-wire = { workspace = true }

[dependency-groups]
dev = [
    { include-group = "sandbox-test" },
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6",
    # Generates the pydantic models of the wire types from
    # rust/crates/wire/schema/wire.json (decision CH9-1). An exact pin, so
    # the generated module only changes when this line does.
    "datamodel-code-generator==0.87.0",
]
sandbox-test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "websockets>=15",
    # starlette's TestClient imports this package for its types. The
    # Python PEP's `mcp` brought it in before. The tests of the services
    # that use the TestClient need it.
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
# bin/tests holds bash tests run by hand, plus one pytest module — the mode
# check, which is about files rather than any one package (bin/AGENTS.md).
# pytest collects only test_*.py there and ignores the .sh siblings.
testpaths = [
    "bin/tests",
    "library/tests",
    "family/tests",
    "caregiver/tests",
    "attendance/tests",
    "door-trigger/tests",
    "door-acp/tests",
    "noticeboard/tests",
    "handover/tests",
    "env/tests",
    "wire/tests",
    "vectors/tests",
]
addopts = "-q"
asyncio_mode = "auto"
# A run in a sandbox imports the code of the clone under test: the test
# venv of the image installs no member of the workspace (playpen/
# Dockerfile, the `creche-test-venv` stage). On the host, `uv sync`
# installs the members from these same trees, so the entries name the same
# files and change no host run.
pythonpath = [
    "library/src",
    "family/src",
    "caregiver/src",
    "attendance/src",
    "door-trigger/src",
    "door-acp/src",
    "noticeboard/src",
    "handover/src",
    "env/src",
    "wire/src",
]
markers = [
    "slow: spawns real subprocesses",
    "docs: reads a doc or checks one exists, so a docs-only change runs it (bin/lib/docsrule.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TC004 is load-bearing, not tidiness: `cli.py` imports the control plane
# inside its handlers and keeps annotation-only names in a TYPE_CHECKING
# block. pyright accepts a name from that block being used at run time —
# verified — and the result is a NameError inside a subcommand. TC004 is the
# only check that catches it. TC005 keeps the block from rotting to empty.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TC004", "TC005"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["RUF059"]
# Generated (wire/AGENTS.md): a schema description is one string literal.
"wire/src/creche_wire/models.py" = ["E501"]

[tool.ruff.lint.isort]
# The root conftest.py makes `conftest` look first-party. A suite that
# imports its OWN conftest.py by name needs isort to file it as
# third-party. Keep that one block.
known-third-party = ["conftest"]

[tool.coverage.run]
branch = true
source = [
    "library",
    "agent_family",
    "caregiver",
    "attendance",
    "agent_door_trigger",
    "agent_door_acp",
    "noticeboard",
    "handover",
    "creche_env",
    "creche_wire",
]

# The pydantic models of the wire types (decision CH9-1, wire/AGENTS.md).
# `uv run datamodel-codegen` writes wire/src/creche_wire/models.py from the
# schema the Rust crate commits, and `--check` (bin/quality-gate.sh) fails
# when the committed module differs from what this section writes.
[tool.datamodel-codegen]
input = "rust/crates/wire/schema/wire.json"
input-file-type = "jsonschema"
output = "wire/src/creche_wire/models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
# The schema is one document of `$defs`. Its root is no type of its own.
skip-root-model = true
use-annotated = true
use-schema-description = true
use-double-quotes = true
keep-model-order = true
# Each scalar is a strict type, so a model refuses "1" or 1.0 or true for an
# int even when a caller skips `creche_wire.read` (wire/AGENTS.md).
strict-types = ["str", "bytes", "int", "float", "bool"]
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]
custom-file-header = """# Generated from rust/crates/wire/schema/wire.json. Do not edit.
# To write it again, run `uv run datamodel-codegen` at the root of the repository."""
