[project]
name = "agent-control-workspace"
# Frozen. No number lives in a file: a version is a `<component>-vX.Y.Z` tag
# that CI allocates at merge (.github/workflows/release.yml). uv needs the
# field to resolve the workspace, so it stays, and nothing reads it.
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "library",
    "agent-family",
    "caregiver",
    "attendance",
    "agent-door-trigger",
    "agent-door-acp",
    "noticeboard",
    "handover",
    "creche-env",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["library", "family", "caregiver", "attendance", "door-trigger", "door-acp", "noticeboard", "handover", "env"]

[tool.uv.sources]
library = { workspace = true }
agent-family = { workspace = true }
caregiver = { workspace = true }
attendance = { workspace = true }
agent-door-trigger = { workspace = true }
agent-door-acp = { workspace = true }
noticeboard = { workspace = true }
handover = { workspace = true }
creche-env = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "websockets>=15",
    # starlette's TestClient imports this package for its types. The
    # Python PEP's `mcp` brought it in before. The tests of the services
    # that use the TestClient need it.
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
# bin/tests holds bash tests run by hand, plus one pytest module — the mode
# check, which is about files rather than any one package (bin/AGENTS.md).
# pytest collects only test_*.py there and ignores the .sh siblings.
testpaths = [
    "bin/tests",
    "library/tests",
    "family/tests",
    "caregiver/tests",
    "attendance/tests",
    "door-trigger/tests",
    "door-acp/tests",
    "noticeboard/tests",
    "handover/tests",
    "env/tests",
    "vectors/tests",
]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "slow: spawns real subprocesses",
    "docs: reads a doc or checks one exists, so a docs-only change runs it (bin/lib/docsrule.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TC004 is load-bearing, not tidiness: `cli.py` imports the control plane
# inside its handlers and keeps annotation-only names in a TYPE_CHECKING
# block. pyright accepts a name from that block being used at run time —
# verified — and the result is a NameError inside a subcommand. TC004 is the
# only check that catches it. TC005 keeps the block from rotting to empty.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TC004", "TC005"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["RUF059"]

[tool.ruff.lint.isort]
# The root conftest.py makes `conftest` look first-party. A suite that
# imports its OWN conftest.py by name needs isort to file it as
# third-party. Keep that one block.
known-third-party = ["conftest"]

[tool.coverage.run]
branch = true
source = [
    "library",
    "agent_family",
    "caregiver",
    "attendance",
    "agent_door_trigger",
    "agent_door_acp",
    "noticeboard",
    "handover",
    "creche_env",
]
