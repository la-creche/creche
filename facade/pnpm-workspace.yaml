# esbuild ships a platform binary and needs its postinstall script. vitest
# runs on it. Without this list pnpm refuses with ERR_PNPM_IGNORED_BUILDS.
#
# The two false entries arrive with `@flue/runtime`, through
# `@earendil-works/pi-ai`. The facade calls no Google model and no protobuf
# service, so neither script runs.
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

# The facade imports the agent module (agent/AGENTS.md) through
# `workspace:`. One install here installs both, from this lockfile.
packages:
  - '.'
  - '../agent'
