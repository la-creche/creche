name = "code"
kind = "attended"
description = "Coding agent for every repository, the platform included."

model.router = "code-router"
model.budget_usd_per_day = 100

tools.kagi = ["kagi_search_fetch", "kagi_extract"]
# The credential behind this server cannot reach the three platform repos
# (contract 01b §8.2): the credential half of `spec.md` §4.4.
tools.github-code = "all"
tools.github-platform = "all"
tools.vikunja-code = "all"
tools.vikunja-home-assistant = "all"
tools.vikunja-networking = "all"

verbs.release.components = [
    "chaperone",
    "attendance",
    "caregiver",
    "noticeboard",
    "playpen",
    "mcp-servers",
    "infra",
    "handover",
]

delegates = ["vault-oracle"]

egress = [
    "github.com",
    "api.github.com",
    "codeload.github.com",
    "objects.githubusercontent.com",
    "release-assets.githubusercontent.com",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
    "security.ubuntu.com",
    "archive.ubuntu.com",
]

shell = true
sandbox_tools = ["read", "grep", "glob", "write", "edit", "bash"]
sandbox.cpus = 8
sandbox.memory = "16g"

skills = []
approval = []
