[project]
name = "agent-family"
version = "0.1.0"
description = "family.yaml schema v1, validation report and registry loader (docs/rework/contracts/01, 01b)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pyyaml>=6"]

[project.scripts]
agent-family = "agent_family.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_family"]


[tool.uv]
# uv rebuilds a local package only when pyproject.toml, setup.py or setup.cfg
# changes, and every first-party package stays at one version. Without the
# source in the key, a non-editable build installs the FIRST wheel uv ever
# cached for this directory, for ever, so a new commit's tree runs old code
# (handover/tests/test_handover_ced_uv_guard.py).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
