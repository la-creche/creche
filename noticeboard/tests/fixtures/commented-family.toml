# A family file with a comment of every shape a save must keep: this
# header, one inside a list, one inside a mapping and one at a line's end.
name = "chat"
kind = "attended"
description = "General assistant. Knows the operator, searches, delegates, asks for tickets."

# The chat router. The budget is 15 USD per day.
model.router = "agent-router"
model.budget_usd_per_day = 15

verbs.ha_call.allow = [
    # The lights to switch, and one room's heat to set. Each other call of
    # Home Assistant is refused.
    { domain = "light", service = "turn_on" },
    { domain = "light", service = "turn_off" },
    # The living room only.
    { domain = "climate", service = "set_temperature", entity_id = "climate.living_room" },
]

tools.kagi = ["kagi_search_fetch", "kagi_extract"]
# The four reads contract 01 §8.1 names.
tools.ha-read = ["ha_get_state", "ha_search", "ha_get_overview", "ha_get_history"]
tools.ha = "all"
tools.vikunja-home-assistant = "all"
tools.vikunja-finance = "all"

# One target: a ticket is asked for, never written.
verbs.enqueue.targets = ["scrum-lead"]

delegates = ["vault-oracle", "coding-sandbox"]

egress = [] # every reach goes through the PEP, so every reach is audited

shell = false
sandbox_tools = ["read", "grep", "glob", "write", "edit"]
sandbox.cpus = 4
sandbox.memory = "8g"

skills = ["grill-me", "handoff", "memory-writing"]
approval = []
