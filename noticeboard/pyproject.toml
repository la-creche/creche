[project]
name = "noticeboard"
version = "0.1.0"
description = "The noticeboard: every family, sandbox and session on one page (invariant 20)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    # A form save patches the family file round-trip so its comments survive
    # (`yamlkeep.py`). It parses nothing for meaning: `agent-family` stays the
    # registry's one reader.
    "ruamel.yaml>=0.18",
    "agent-family",
]

[project.scripts]
noticeboard = "noticeboard.__main__:main"
# The component's verify hook. `noticeboard/component.yaml` names it, and
# contract 06 §4 rule 6 says the hook ships inside this artifact.
noticeboard-verify = "noticeboard.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noticeboard"]

[tool.uv.sources]
agent-family = { workspace = true }

[tool.uv]
# uv rebuilds a local package only when pyproject.toml, setup.py or setup.cfg
# changes, and every first-party package stays at one version. Without the
# source in the key, a non-editable build installs the FIRST wheel uv ever
# cached for this directory, for ever, so a new commit's tree runs old code
# (handover/tests/test_handover_ced_uv_guard.py).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
