# The second delegate, from `docs/rework/spec.md` §4.4 and contract 01 §8.5.
#
# Two differences from contract 01 §8.5: the model alias, for the reason
# `vault-oracle/family.toml` gives, and the sandbox names no `image = "python"`.
name = "coding-sandbox"
kind = "thin"
description = "Runs code for one chat, in a VM that lives for one job."

model.router = "agent-router"
model.budget_usd_per_day = 5

tools = {}
verbs = {}
delegates = []

# "shell, no network" (docs/rework/spec.md §4.4) is these two lines together.
egress = []

shell = true
sandbox_tools = ["read", "grep", "glob", "write", "edit"]
sandbox.cpus = 4
sandbox.memory = "8g"

skills = []
approval = []
job.timeout = "120s"
