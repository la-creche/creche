# The thin family of stage 5, from `docs/rework/spec.md` §4.4.
#
# Stage 5 needs it for one line of contract 02 §13 rule 5: a thin job is never
# queued. It is stage 3's `vault-oracle` with the three read-only mounts
# dropped, because no stage 5 scenario reads a file inside it.
name: vault-oracle
kind: thin
description: Retrieval. Searches the indexed corpora and answers with citations.

model: { router: agent-router, budget_usd_per_day: 5 }

tools: {}

verbs:
  embed: {}

delegates: [] # required empty on a thin family (§3.6.4)

egress: []

shell: false
sandbox_tools: [read, grep, find, ls]
sandbox: { cpus: 2, memory: 4g }

skills: []
approval: []
job: { timeout: 120s }
