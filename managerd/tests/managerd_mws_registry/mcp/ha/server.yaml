name: ha
identity: "The same Home Assistant user as ha-read, non-admin, with the same entity read allowlist. Its write reach is bounded by that HA user's own permissions."

install:
  source: pypi
  package: ha-mcp
  version: 8.4.3
  lock: mcp/ha/install.lock
  python: "3.13"

run:
  entrypoint: ha-mcp
  env:
    HOMEASSISTANT_URL: http://192.0.2.20:8123
    HOMEASSISTANT_TOKEN: secret:ha_read_token
    READ_ONLY_MODE: "false"
    ENABLE_WEBSOCKET: "true"
    HA_MCP_DISABLE_SETTINGS_UI: "true"
    HA_MCP_DISABLE_UPDATE_CHECK: "true"
  state_dir: true
  state_dir_env: HA_MCP_CONFIG_DIR

tools:
  - { name: ha_call_service, description: Call one Home Assistant service on one entity., write: true }

shared_secrets:
  - secret: ha_read_token
    server: ha-read
