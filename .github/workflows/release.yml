# Release on merge: the gate again, as the same jobs on separate runners,
# then one tag and one Release per component the merge changed.
#
#   scope ──┬── lint                  ruff, ruff format, pyright, and on a
#           │                         docs push the tests marked `docs`
#           ├── tests (1..N)   code   the full suite, one shard per job
#           ├── playpen     code   the TypeScript suite and its build
#           ├── proc        code   the process-level suite, each service
#           │                      as a process, on the built playpen
#           ├── rust        code   cargo fmt, clippy, deny and test, for a
#           │                      push that touches rust/ or vectors/
#           ├── rust-coverage  code   the tests with cargo llvm-cov and the
#           │                      coverage rule, for the same push
#           └── systemd-proof
#                           code   the restart rule of the daemon units, on
#                                  the systemd of the runner, for a push
#                                  that touches systemd/
#                                 └── release   tags + Releases, only when
#                                               every job passed
#
# NO NUMBER LIVES IN A FILE (contract 06 §2.1). Two sessions that wrote the
# same root version into two pull requests left main's tip untagged
# (stage7-releases.md pain 1). The `release` job allocates instead: for each
# component, the newest `<component>-vX.Y.Z` tag plus the level a `bump:`
# label asks for. The logic is handover/bin/allocate-tags.sh and the tested
# library behind it (handover/tests/test_handover_allocate.py,
# handover/tests/test_handover_tag_script.py). This file only calls it.
#
# A RUN CAN BE MISSED, and the script is built for it: a red main tags
# nothing, and a pending `release` job gives way to a newer one. Each
# component is tagged when its own paths changed since its OWN newest tag,
# not since the last commit, so the next green run covers what the missed
# one left. A component with no tag gets its first one, whatever the merge
# changed.
#
# Only CI mints a Release — the default GITHUB_TOKEN makes
# github-actions[bot] the author, which the host's releaser checks (P1). No
# repo secret is involved. Only the `release` job may write: every other job
# runs the merged code with a read-only token.
#
# THIS WORKFLOW FILES NO RELEASE REQUEST (stage7-releases.md §3.3, threat
# table row 20). What CI produces is a Release. On the host,
# `creche-follow.timer` files the request for each new tag of a component
# that has had a release (`handover/src/handover/follow/`). CI reaches no
# host, and step 5's tap is unconditional.
#
# SO A TAG ASKS THE OPERATOR FOR A RELEASE, and a tag for prose would ask for
# a release of nothing. The planner drops a `.md` path outside `tests/` and
# `fixtures/` before it decides what a range touched (`allocate.is_prose`).
#
# A docs-only push onto a commit whose own run passed runs only the tests
# marked `docs`, as gate.yml does (bin/lib/docsrule.sh). The tag step still
# runs.
# The `tests`, `playpen`, `proc`, `rust`, `rust-coverage` and
# `systemd-proof` jobs are gate.yml's, and bin/tests/test_gate_workflow.py
# holds the two files to the same shard command — diff the two when changing
# either.
#
# A push that touches nothing under rust/ and nothing under vectors/, onto a
# commit whose own run passed, skips the steps of the `rust` job and of the
# `rust-coverage` job (bin/lib/rustrule.sh). Each job is still a success. A
# change under rust/ reaches no component, so it mints no tag
# (handover/src/handover/allocate.py).
#
# The `systemd-proof` job follows the same rule for its own files. A push
# that touches no file of the proof, onto a commit whose own run passed,
# skips the one step of that job (`--unchanged` of bin/systemd-proof.sh).
#
# agent-mcp has a SIBLING of the `release` job, in its own
# rework-component-tags.yml. `mcp-servers` is its component, not
# agent-control's (contract 06 §1 row 6), and the planner scopes every
# decision to one repository, so this run never tags it. That workflow
# checks agent-control out at a pinned commit and runs the same script
# against agent-mcp's tree.
#
# `workflow_dispatch` starts the same run by hand, for a commit a missed run
# left behind. Read the plan first, from any checkout:
#
#   GITHUB_REPOSITORY=<owner>/agent-control GITHUB_SHA=$(git rev-parse HEAD) \
#     handover/bin/allocate-tags.sh --dry-run
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the scope job asks whether the previous push's run passed

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      rust: ${{ steps.scope.outputs.rust }}
      systemd: ${{ steps.scope.outputs.systemd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the docs rule diffs against the commit main held
          # before this push.
          fetch-depth: 0

      # `docs` or `code`: what this push changes, from the commit main held
      # before it. `docs` also needs that commit's own run of this workflow
      # to have passed, so a docs merge never skips the suite over a tree
      # whose code failed, or is still in, its own run. A push the rule
      # cannot read answers `code`: a `before` this clone lacks, a run GitHub
      # does not list, and a dispatch, which has no `before` at all.
      #
      # `rust` is `false` only by the same two facts: that run passed, and
      # this push touches nothing under rust/ and nothing under vectors/. So
      # a push never skips the Rust checks over a tree whose Rust failed, or
      # is still in, its run.
      #
      # `systemd` is `false` only by two facts of the same kind: that run
      # passed, and the script says that this push changes no file of the
      # systemd proof. A script that fails, or that is absent, runs the
      # proof.
      - name: scope
        id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . bin/lib/docsrule.sh
          . bin/lib/rustrule.sh
          scope=code
          rust=true
          systemd=true
          passed=0
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
            passed="$(gh run list --workflow release.yml --commit "$BEFORE" \
              --status success --limit 1 --json databaseId --jq length 2>/dev/null || echo 0)"
          fi
          if [[ "$passed" == 1 ]] && docs_only "$BEFORE" "$GITHUB_SHA"; then
            scope=docs
          fi
          if [[ "$passed" == 1 ]] && ! rust_touched "$BEFORE" "$GITHUB_SHA"; then
            rust=false
          fi
          if [[ "$passed" == 1 ]] && bin/systemd-proof.sh --unchanged "$BEFORE" "$GITHUB_SHA"; then
            systemd=false
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "scope: $scope"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "rust: $rust"
          echo "systemd=$systemd" >> "$GITHUB_OUTPUT"
          echo "systemd: $systemd"

  lint:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/uv-sync

      # No flag: ruff, ruff format and pyright, no test. The shards test.
      - run: bin/quality-gate.sh
        if: needs.scope.outputs.scope == 'code'

      # A docs push has no shard: the tests that read a doc run here.
      - run: bin/quality-gate.sh --docs
        if: needs.scope.outputs.scope == 'docs'

  tests:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-latest
    strategy:
      # A red shard does not stop the others: one run shows every failure.
      fail-fast: false
      matrix:
        # Labels, and their count is N. The run line reads the job's index
        # and the job total, so no edit here can leave a shard out.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: some tests read git state.
          fetch-depth: 0

      - uses: ./.github/actions/uv-sync

      # `worksteal`: a runner has two workers, and under xdist's default
      # one of them ends up holding the slow tests while the other idles.
      # An idle worker that takes from the busy one's queue cut the
      # slowest of six shards from 153 s to 121 s.
      - run: uv run pytest -n auto --dist worksteal --shard "$((INDEX + 1))/$TOTAL"
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}

  # agent-control only. The playpen is TypeScript and the Python gate
  # never runs its suite. pnpm's version is playpen/package.json's
  # packageManager field; node matches playpen/Dockerfile's NODE_TAG.
  # `build` runs too: 120 integration tests skip when dist/ is absent, so
  # a bundle that does not build has to fail HERE, not as a quiet skip.
  playpen:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-latest
    # `pnpm run build` fixes the LAN address in the bundle and refuses to
    # build without one (playpen/build.mjs). CI throws the bundle away,
    # so the example site's TEST-NET-1 address does.
    env:
      AGENT_LAN_ADDRESS: 192.0.2.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: playpen/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playpen/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile && pnpm test && pnpm run typecheck && pnpm run build
        working-directory: playpen

  # The process-level suite (integration/proc/AGENTS.md). It starts each
  # service as a process, from the command its unit runs, so it can judge a
  # service in any language. It is not in `testpaths`: no shard runs it.
  # It needs the built playpen, so it has node and pnpm as the playpen job
  # has them, and the build takes the same TEST-NET-1 address.
  #
  # CRECHE_PROC_NO_SKIP: a test that needs the bundle skips itself when the
  # bundle is missing. A run in which every test skips is green and judged
  # nothing, so here a skip is a failure.
  #
  # The time limit: a teardown waits 20 s for each process group. A fault
  # in the harness can cost every test that wait, and a job has 6 hours by
  # default. On a laptop the suite runs in about 5 minutes.
  proc:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: playpen/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playpen/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: playpen
        env:
          AGENT_LAN_ADDRESS: 192.0.2.10

      - uses: ./.github/actions/uv-sync

      - run: uv run pytest integration/proc -m slow
        env:
          CRECHE_PROC_NO_SKIP: "1"

  # The Cargo workspace under rust/: bin/rust-gate.sh, the checks the hooks
  # run. The job runs on every code change, and on a change that touches
  # nothing under rust/ every step but the checkout is skipped
  # (bin/lib/rustrule.sh). The job is then a success: a job skipped as a
  # whole on a code change reads as red in the verdict. A change to the Rust
  # checks themselves, this file included, counts as a change under rust/.
  # So does a change under vectors/: the Rust tests read vectors/data.
  #
  # The runner has rustup, so no action installs the toolchain.
  # `rustup toolchain install` with no name installs what
  # rust/rust-toolchain.toml names, with rustfmt and clippy. `rustup show`
  # does that only while rustup's auto-install is on. The three version
  # lines fail the step when a component is absent.
  #
  # The cache key holds the toolchain and the lock file. A change to
  # either starts from an empty cache.
  #
  # Each step asks `!= 'false'`, not `== 'true'`: an answer that is missing
  # runs the checks.
  rust:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-latest
    env:
      # A CI build starts from a cache or from nothing, never from the last
      # build of the same tree, so the incremental state is only weight.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: toolchain
        if: needs.scope.outputs.rust != 'false'
        working-directory: rust
        run: |
          rustup toolchain install --no-self-update
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # cargo-deny: the program behind the `cargo deny` step of
      # bin/rust-gate.sh, which checks the locked crates against
      # rust/deny.toml. rustup does not install it, and no action does here.
      # The step takes the archive from a release of the cargo-deny
      # repository. It checks the SHA-256 of the archive against the
      # constant before the unpack, so an archive that changed stops the job.
      # bin/rust-gate.sh fails in CI when cargo-deny is not on PATH.
      #
      # To take another version, change the two constants together. Compute
      # the SHA-256 of the new archive, and compare it with the `.sha256`
      # file of that release. bin/tests/test_gate_workflow.py pins both.
      - name: cargo-deny
        if: needs.scope.outputs.rust != 'false'
        working-directory: rust
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          found="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          if [[ "$found" != "$DENY_SHA256" ]]; then
            echo "cargo-deny: the archive has the SHA-256 $found, not $DENY_SHA256" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-deny" --strip-components 1 "$name/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/cargo-deny:$PATH" cargo deny --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.scope.outputs.rust != 'false'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}

      - run: bin/rust-gate.sh --tests
        if: needs.scope.outputs.rust != 'false'

  # The coverage rule of the Cargo workspace: bin/rust-coverage.sh
  # (rust/AGENTS.md, "The coverage rule"). The script runs the tests with
  # `cargo llvm-cov`. It fails when a region or a line of a file in
  # rust/coverage-files.txt ran in no test. It prints one line with the
  # counts of each crate.
  #
  # The job takes the rule of the `rust` job: it runs on every code change,
  # and on a change that touches nothing under rust/ every step but the
  # checkout is skipped. The job is then a success.
  #
  # The toolchain is the one rust/rust-toolchain.toml names. `rustup
  # component add` gives it the LLVM tools that cargo-llvm-cov calls. The
  # toolchain file does not name that component: no other job needs it.
  #
  # The job keeps no cache: each run builds the workspace one time. The tool
  # puts the measurement into each crate of the workspace and into no
  # dependency. The time limit stops a test that does not end with the
  # measurement in it. A job has 6 hours by default.
  rust-coverage:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # As in the `rust` job: no build here starts from the last one.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: toolchain
        if: needs.scope.outputs.rust != 'false'
        working-directory: rust
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
          cargo --version

      # cargo-llvm-cov: the program behind the `cargo llvm-cov` step of
      # bin/rust-coverage.sh. rustup does not install it, and no action does
      # here. The step takes the archive from a release of the cargo-llvm-cov
      # repository. It checks the SHA-256 of the archive against the constant
      # before the unpack, so an archive that changed stops the job. The
      # archive holds the program and no directory.
      #
      # To take another version, change the two constants together. Compute
      # the SHA-256 of the new archive, and compare it with the digest that
      # the release page shows for that archive.
      # bin/tests/test_gate_workflow.py pins both.
      - name: cargo-llvm-cov
        if: needs.scope.outputs.rust != 'false'
        working-directory: rust
        env:
          LLVM_COV_VERSION: "0.9.1"
          LLVM_COV_SHA256: "3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522"
        run: |
          set -euo pipefail
          name="cargo-llvm-cov-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/$name.tar.gz"
          found="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          if [[ "$found" != "$LLVM_COV_SHA256" ]]; then
            echo "cargo-llvm-cov: the archive has the SHA-256 $found, not $LLVM_COV_SHA256" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cargo-llvm-cov"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-llvm-cov" cargo-llvm-cov
          echo "$RUNNER_TEMP/cargo-llvm-cov" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/cargo-llvm-cov:$PATH" cargo llvm-cov --version

      - run: bin/rust-coverage.sh
        if: needs.scope.outputs.rust != 'false'

  # The restart rule of the daemon units: bin/systemd-proof.sh. A unit with
  # `RestartPreventExitStatus=78` must stay stopped after exit status 78, and
  # only systemd can prove that. The script makes three units of its own on
  # the systemd of the runner, as root. It then gives each unit file under
  # systemd/ to `systemd-analyze verify`. The runner must run systemd as its
  # first process, and its sudo must not ask for a password.
  #
  # The job has the form of the `rust` job. It runs on every code change, and
  # on a change that touches no file of the proof its one step after the
  # checkout is skipped (`--unchanged` of the script). The job is then a
  # success. The files of the proof are systemd/ and the script.
  #
  # No `container:` key: a container has no systemd as process 1. On a
  # machine without one of the two the script fails. It does not skip.
  #
  # The time limit: a job has 6 hours by default, and the proof needs minutes.
  systemd-proof:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: bin/systemd-proof.sh
        if: needs.scope.outputs.systemd != 'false'

  # `always()`: on a docs push `tests`, `playpen`, `proc`, `rust`,
  # `rust-coverage` and `systemd-proof` are skipped, and a job that needs a
  # skipped job is skipped by default. The verdict step is what holds the tags
  # back when a job failed.
  release:
    needs: [scope, lint, tests, playpen, proc, rust, rust-coverage, systemd-proof]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags + Releases
      pull-requests: read # the merge SHA -> PR lookup, for labels and the body
    # `cancel-in-progress: false` is the whole mechanism: one allocation at a
    # time, and none stopped half way, so two merges never read the same
    # newest tag. A pending job gives way to a newer one, and the newer run
    # covers its range.
    concurrency:
      group: release-allocate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every tag: the newest <component>-v* tag is what
          # the level is added to, and a shallow clone does not have it. A
          # missing tag here is the one way the allocation can collide — and
          # with the first-tag rule it is also how a component that already
          # has a tag would wrongly be given another first one. That tag is
          # also the base of the component's `git diff`, so a shallow clone
          # would refuse it as "not an ancestor" instead.
          fetch-depth: 0

      # No `if` on the steps below: they run only when this one passed.
      - name: every job passed
        uses: ./.github/actions/verdict
        with:
          needs: ${{ toJSON(needs) }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Idempotent: a component already tagged on this SHA is a no-op, and
      # a tag is never moved or deleted (handover/bin/allocate-tags.sh).
      #
      # TAG_REPO: the catalog's name for THIS repository, whatever its host
      # calls it. Without it the script takes the name from
      # GITHUB_REPOSITORY, and a hosted name the catalog does not hold
      # stops the run.
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REPO: agent-control
        run: handover/bin/allocate-tags.sh
