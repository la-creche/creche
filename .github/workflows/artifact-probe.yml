# The artifact probe: one measurement, started by hand.
#
#   guard ── build ── sign ── verify
#
# A binary component can be built in CI and checked on the host. CI then
# builds a static program, packs it into an archive and signs the archive
# with a keyless Sigstore signature. Root on the host checks that signature
# in a transient unit that has no privilege, and builds nothing. That way
# depends on facts about tools: cargo, tar, gzip, cosign and systemd-run.
# This workflow measures each fact on a GitHub runner, before code depends
# on it. bin/artifact-probe.sh holds the measurement, and
# bin/tests/test_artifact_probe_workflow.py pins this file.
#
#   guard    prints the ref. It always runs.
#   build    a static `agent-family` for the target, with the paths of the
#            runner remapped. No file of the tree holds such a path. Two
#            packs of the tree are equal, byte for byte.
#   sign     the keyless signature of the archive.
#   verify   cosign inside systemd-run, as a dynamic user: one child with
#            the network, then a refresh child and a child with no network.
#            Four checks that must fail. The status of a start fault and of
#            a time limit. The same check from inside a unit that has the
#            sandbox lines of systemd/creche-handover.service.
#
# THE RUN CHANGES NOTHING HERE. It attaches nothing to a Release, makes no
# tag and changes no file of the repository. Each job but `sign` holds the
# read-only token. Its results are the step summaries and one file,
# `probe-report.json`, in the workflow artifact `probe-report`.
#
# START IT ON `main` ONLY. The release executor reads each workflow run on
# the head of a merged pull request, and each one must be a success
# (handover/src/handover/executor/provenance.py, P5). So a run on another ref
# measures nothing: `guard` passes, the three other jobs are skipped, and the
# run is a success. Do not cancel such a run. A cancelled run on the head of
# a pull request blocks the release of that pull request.
#
# EACH RUN ON `main` WRITES ONE ENTRY TO THE PUBLIC SIGSTORE LOG. The entry
# names this repository, this workflow file and the commit. No one can remove
# an entry. The operator decides when a run starts.
#
# THE JOB `sign` HOLDS THE IDENTITY TOKEN AND NO CODE OF THE REPOSITORY. It
# has no checkout and no local action. It takes the archive of `build`,
# compares it with the SHA-256 that `build` gave as a job output, and signs
# it. A change of the repository thus cannot run in the job that can sign.
#
# cosign comes from a release of the cosign repository. The step compares
# the SHA-256 of the program with the constant below before the first use.
# The jobs `sign` and `verify` hold the same step text.
name: artifact-probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The target of the program: a static program needs no library of the
  # host.
  PROBE_TARGET: x86_64-unknown-linux-musl
  # To take another version of cosign, change the two constants together.
  # Compute the SHA-256 of the asset `cosign-linux-amd64` of the new release,
  # and compare it with the file `cosign_checksums.txt` of that release.
  COSIGN_VERSION: "v3.1.3"
  COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"

jobs:
  # No `if`: this job is what makes a run on another ref a success.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: ref
        run: 'echo "artifact-probe: the ref of this run is $GITHUB_REF"'

  build:
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # One line of `sha256sum`: the SHA-256, two spaces, the archive name.
      digest: ${{ steps.build.outputs.digest }}
      toolchain: ${{ steps.build.outputs.toolchain }}
      remap_needed: ${{ steps.build.outputs.remap_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build
        id: build
        run: bin/artifact-probe.sh build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-archive
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [guard, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-archive
          path: probe

      # Each job of a run can write a workflow artifact. So the job signs
      # only the file that the job output names, and only when its bytes
      # have the SHA-256 of that output. A second file stops the job.
      - name: digest
        working-directory: probe
        run: |
          set -euo pipefail
          line='^[0-9a-f]{64}  [A-Za-z0-9._-]+$'
          if [[ ! "$DIGEST" =~ $line ]]; then
            echo "sign: the job build gave no SHA-256 line" >&2
            exit 1
          fi
          archive="${DIGEST:66}"
          for file in *; do
            if [[ "$file" != "$archive" ]]; then
              echo "sign: the job build did not name the file $file" >&2
              exit 1
            fi
          done
          sha256sum --check --strict <<< "$DIGEST"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: cosign
        run: |
          set -euo pipefail
          cosign="$RUNNER_TEMP/cosign"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          found="$(sha256sum "$cosign" | cut -d ' ' -f 1)"
          if [[ "$found" != "$COSIGN_SHA256" ]]; then
            echo "cosign: the program has the SHA-256 $found, not $COSIGN_SHA256" >&2
            exit 1
          fi
          chmod 0755 "$cosign"
          "$cosign" version
          echo "COSIGN=$cosign" >> "$GITHUB_ENV"

      - name: sign
        working-directory: probe
        run: |
          set -euo pipefail
          "$COSIGN" sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-signed
          path: probe
          if-no-files-found: error
          retention-days: 1

  # It needs `build` for two facts of the report: the name of the toolchain,
  # and whether the build needs the remap flags.
  verify:
    needs: [guard, build, sign]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: signed
        with:
          name: probe-signed
          path: ${{ runner.temp }}/probe-signed

      - name: cosign
        run: |
          set -euo pipefail
          cosign="$RUNNER_TEMP/cosign"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          found="$(sha256sum "$cosign" | cut -d ' ' -f 1)"
          if [[ "$found" != "$COSIGN_SHA256" ]]; then
            echo "cosign: the program has the SHA-256 $found, not $COSIGN_SHA256" >&2
            exit 1
          fi
          chmod 0755 "$cosign"
          "$cosign" version
          echo "COSIGN=$cosign" >> "$GITHUB_ENV"

      - name: verify
        id: verify
        env:
          PROBE_SIGNED: ${{ steps.signed.outputs.download-path }}
          PROBE_TOOLCHAIN: ${{ needs.build.outputs.toolchain }}
          PROBE_REMAP_NEEDED: ${{ needs.build.outputs.remap_needed }}
        run: bin/artifact-probe.sh verify

      # A red run needs its report most: the report says which case failed.
      # The script names the report before the first case, so the step runs
      # after each failure that leaves a report.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.verify.outputs.report != '' }}
        with:
          name: probe-report
          path: ${{ steps.verify.outputs.report }}
          if-no-files-found: error
          retention-days: 90
