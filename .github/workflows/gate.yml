# DEBUG ONLY (la-creche/creche#591): shard 4 of the 3.14 branch, one test id per line.
name: gate
on: [pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/uv-sync
      - run: |
          ulimit -a
          uv run pytest -p no:xdist -vv --shard 4/4 2>&1 | tee /tmp/shard4.log
          echo "pytest status ${PIPESTATUS[0]}"
        shell: bash
