# PR gate: lint, the full suite, the agent module's vitest suite, the ACP
# facade's vitest suite, the process-level suite, the two old integration
# suites, the Rust checks and the systemd proof, as jobs that run at once on
# separate runners.
#
#   scope ──┬── tests (1..N)   code   the full suite, one shard per job
#           ├── agent       code   the agent module's suite and types
#           ├── facade      code   the ACP facade's suite, build and types
#           ├── proc        code   the process-level suite, each service
#           │                      as a process, on the built facade
#           ├── suites      code   the old suite of integration/, in a
#           │                      pytest run of its own
#           ├── memory      code   the memory package, in its own venv:
#           │                      pyright and pytest
#           ├── playpen-image
#           │              code   each flavor image and its env file
#           ├── rust        code   cargo fmt, clippy and test of rust/
#           ├── systemd-proof
#           │               code   the restart rule of the daemon units, on
#           │                      the systemd of the runner, for a change
#           │                      under systemd/. No such change: no proof
#           ├── kvm         code   the kvm_ tests of rust/, on the KVM of
#           │                      the runner
#           └── vmm-archive code   the vmm archive, built unsigned, for a
#                                  change of a file of the vmm build. No
#                                  such change: no build
#   lint ─────────────────────────┐   ruff, ruff format, pyright, and on a
#                                 │   docs PR the tests marked `docs`
#                                 └── gate   red unless every job passed
#
# A job is billed in whole minutes, so a check of a few seconds rides in a
# job that runs anyway: the docs tests in `lint`.
#
# No version rule: a pull request carries no number. release.yml allocates
# each component's tag at the merge (contract 06 §2.1).
#
# It stays ONE workflow with ONE check named `gate`. The release executor
# reads the workflow runs on the PR head, and every one must be a success
# (handover/src/handover/executor/provenance.py, P5): a second workflow
# that can fail or be cancelled there would block a release. Sessions read
# `gh pr checks` for `gate`.
#
# A PR of nothing but docs runs `bin/quality-gate.sh --docs` in the lint job,
# lint and only the tests that read a doc: no shard, no agent job, no
# facade job, no proc job, no suites job, no rust job, no systemd-proof
# job and no kvm job (bin/lib/docsrule.sh, the rule release.yml reads too).
#
# Every shard runs the whole of pyproject.toml's `testpaths` with
# `--shard K/N` (conftest.py): a test's own id puts it in exactly one shard.
# No shard names a path, so a suite added to `testpaths` runs here with no
# change to this file. bin/tests/test_gate_workflow.py pins all of it.
#
# Actions are SHA-pinned with the tag as a comment, as agent-registry's
# validate.yml does.
# release.yml runs the same `tests`, `agent`, `facade`, `proc`, `suites`,
# `rust`, `systemd-proof` and `kvm` jobs after the merge. `vmm-archive` is
# the one job of this file alone: release.yml builds the archive in its
# `artifacts` job.
# agent-mcp carries its own gate.yml, with no JS steps. Diff the files when
# changing one.
name: gate

# `merge_group`: a merge queue runs this file on the merged result of the
# pull requests it groups, and merges on that run's `gate`. A repository
# with no queue never sends the event.
on: [pull_request, merge_group]

permissions:
  contents: read

# A new push to a PR stops the run of its old head. P5 reads only the runs
# on the merged PR head, so a run cancelled on an older head blocks nothing.
# A run cancelled on the head itself does block, e.g. after a close and a
# reopen while the gate runs: comment `!retest` on the PR (retest.yml).
#
# A merge group has no head ref. It runs on its own queue branch, e.g.
# refs/heads/gh-readonly-queue/main/pr-12-<sha>, so its ref is the group:
# with an empty one every group in the queue would cancel the others.
concurrency:
  group: gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      systemd: ${{ steps.scope.outputs.systemd }}
      vmm: ${{ steps.scope.outputs.vmm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the merge-base with the base branch.
          fetch-depth: 0

      - uses: ./.github/actions/scope
        id: scope

  # It asks the scope itself, so it starts with the scope job and a docs PR
  # does not wait for one job before the other.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the merge-base with the base branch.
          fetch-depth: 0

      - uses: ./.github/actions/scope
        id: scope

      - uses: ./.github/actions/uv-sync

      # No flag: ruff, ruff format and pyright, no test. The shards test.
      - run: bin/quality-gate.sh
        if: steps.scope.outputs.scope == 'code'

      # A docs PR has no shard: the tests that read a doc run here.
      - run: bin/quality-gate.sh --docs
        if: steps.scope.outputs.scope == 'docs'

  tests:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    strategy:
      # A red shard does not stop the others: one run shows every failure.
      fail-fast: false
      matrix:
        # Labels, and their count is N. The run line reads the job's index
        # and the job total, so no edit here can leave a shard out.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: some tests read git state.
          fetch-depth: 0

      - uses: ./.github/actions/uv-sync

      # `worksteal`: a runner has two workers, and under xdist's default
      # one of them ends up holding the slow tests while the other idles.
      # An idle worker that takes from the busy one's queue cut the
      # slowest of six shards from 153 s to 121 s.
      - run: uv run pytest -n auto --dist worksteal --shard "$((INDEX + 1))/$TOTAL"
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}

  # The agent module (agent/AGENTS.md). TypeScript, so the Python gate never
  # runs its suite. pnpm's version is agent/package.json's packageManager
  # field. The module is a library: the facade job builds it.
  agent:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: agent/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile && pnpm test && pnpm run typecheck
        working-directory: agent

  # The ACP facade (facade/AGENTS.md). TypeScript, so the Python gate never
  # runs its suite. pnpm's version is facade/package.json's packageManager
  # field. `pnpm test` builds `dist/` first: the suite runs the built bin.
  # facade/pnpm-workspace.yaml names ../agent, so the install here installs
  # agent/ too, from facade/pnpm-lock.yaml, and the build builds it first.
  facade:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: facade/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: facade/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile && pnpm test && pnpm run typecheck
        working-directory: facade

  # The process-level suite (integration/proc/AGENTS.md). It starts each
  # service as a process, from the command its unit runs, so it can judge a
  # service in any language. It is not in `testpaths`: no shard runs it.
  # It needs the built facade, so it has node and pnpm as the facade job
  # has them.
  #
  # CRECHE_PROC_NO_SKIP: a test that needs the facade skips itself when the
  # build is missing. A run in which every test skips is green and judged
  # nothing, so here a skip is a failure.
  #
  # Four workers (-n 4): the runner has 4 vCPU and 16 GB. A run of four
  # workers peaks near 1.3 GB. On one worker the suite took 175 s here.
  #
  # The time limit: each test has 180 s (integration/proc/AGENTS.md, rule
  # 22), and a hung test fails while the run goes on. A job has 6 hours by
  # default. A cold build of the Rust chaperone adds about 1 minute.
  proc:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: facade/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: facade/pnpm-lock.yaml

      # The exit test (integration/proc/test_proc_exit.py) starts the
      # built `creche-facade` and `acp-relay` of facade/dist. The build
      # builds agent/ first. The `facade` job runs the tests of both.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: facade

      - uses: ./.github/actions/uv-sync

      # The Rust chaperone of the row `chaperone-rs`: the binary that the
      # suite builds from the commit of integration/proc/chaperone.pin
      # (integration/proc/proc_chaperone_pin.py). The key holds the pin
      # file and the build script, so a new pin or a new program of the
      # build starts from an empty cache. On a miss the first
      # test that needs the binary builds it with the cargo of the runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/creche-proc/chaperone-rs
          key: proc-chaperone-rs-${{ runner.os }}-${{ hashFiles('integration/proc/chaperone.pin', 'integration/proc/proc_chaperone_pin.py') }}

      - run: uv run pytest integration/proc -m slow -n 4
        env:
          CRECHE_PROC_NO_SKIP: "1"

  # The old suite of integration/ (integration/AGENTS.md):
  # integration/tests_manager. It runs the services inside the pytest
  # process. It is not in `testpaths`: no shard runs it. It needs no node:
  # the job has the checkout and the venv.
  #
  # The job runs the suite with the pytest command that
  # integration/AGENTS.md tells a person to run. integration/tests held a
  # second suite until the session API left attendance (phase 2 plan, row
  # 21). Its stand-in for `sbx` left at the Cloud Hypervisor cut.
  #
  # A test of the suite can skip itself, and a run in which every test
  # skips is green and judged nothing. The suite reads no switch that makes
  # a skip a failure. So the run writes a JUnit report,
  # and the last step reads it. It fails for a test that skipped, for a
  # suite that ran no test and for a report that is missing. It prints the
  # counts and the time of the suite.
  #
  # The time limit: the stack of a test waits for each listener and for each
  # child at its teardown, and the suite has no limit for one test.
  suites:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/uv-sync

      # PYTEST_ADDOPTS: the report is the one addition to the command that
      # integration/AGENTS.md gives.
      - run: uv run pytest integration/tests_manager -m slow
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/suites/tests_manager.xml

      # REPORTS: the report of each suite, one path on each line, in the
      # order of the runs. A run that fails stops the job before this step.
      - name: no test skipped
        shell: python3 {0}
        env:
          REPORTS: |-
            ${{ runner.temp }}/suites/tests_manager.xml
        run: |
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          red = []
          reports = [Path(one) for one in os.environ["REPORTS"].splitlines() if one]
          if not reports:
              red.append("REPORTS names no report")

          for report in reports:
              name = report.stem
              try:
                  suites = list(ET.parse(report).getroot().iter("testsuite"))
              except (OSError, ET.ParseError) as error:
                  red.append(f"{name}: no report to read: {error}")
                  continue

              tests = sum(int(one.get("tests", "0")) for one in suites)
              skipped = sum(int(one.get("skipped", "0")) for one in suites)
              seconds = sum(float(one.get("time", "0")) for one in suites)
              ran = tests - skipped
              print(f"{name}: {ran} of {tests} tests ran, {skipped} skipped, {seconds:.0f} s")

              if ran == 0:
                  red.append(f"{name}: the suite ran no test")
              elif skipped:
                  red.append(f"{name}: {skipped} of {tests} tests skipped")

          for line in red:
              print(f"::error::{line}")

          sys.exit(1 if red else 0)

  # The memory package (memory/AGENTS.md). It is not a workspace member: it
  # has its own lock, because the memory store it pins is too large for the
  # root venv. So it gets a venv, a pyright run and a pytest run of its own.
  memory:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - run: uv sync --locked
        working-directory: memory

      - run: uv run pyright
        working-directory: memory

      - run: uv run pytest
        working-directory: memory

  # Build each flavor that the playpen release publishes, then check what
  # the build alone cannot: /etc/creche/env equals the image config env
  # (CH7-7, CH49). The steps live in playpen/bin/playpen-ci. This run also
  # catches a missing source file and an import that only the image sees.
  playpen-image:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: playpen/bin/playpen-ci

  # The Cargo workspace under rust/ (rust/Cargo.toml): the format check,
  # the lint gate and the tests. The runner has rustup, so no action
  # installs the toolchain. `rustup toolchain install` with no name installs
  # what rust/rust-toolchain.toml names, with rustfmt and clippy.
  #
  # `--locked`: a build that would change rust/Cargo.lock fails.
  #
  # The time limit: the workspace builds in seconds today, and a job has 6
  # hours by default.
  rust:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A CI build starts from nothing, never from the last build of the
      # same tree, so the incremental state is only weight.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: toolchain
        working-directory: rust
        run: |
          rustup toolchain install --no-self-update
          cargo --version

      # The frozen host API files (decision CH33 rule 8, wire/AGENTS.md "The
      # protocol number"). A change may add a host-api-<N>.json of the wire
      # crate, and never edit or delete one. The pathspec * also matches a
      # slash, so it reaches the files in the schema dir. The schema test
      # cannot see a file that a change deleted and wrote again, so this
      # step diffs against the commit the change starts from: the merge
      # group's base, the PR's merge-base, or main before the push. A
      # dispatch has no such commit, and the gate of each PR ran this step.
      # A base that this clone lacks fails the step.
      - name: frozen host api
        shell: bash
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$GROUP_BASE"
          if [[ -z "$base" && -n "$BASE_REF" ]]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          fi
          if [[ -z "$base" && "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          fi
          if [[ -z "$base" ]]; then
            echo "frozen host api: no base commit, nothing to compare"
            exit 0
          fi
          git diff --no-renames --diff-filter=MDT --name-status --exit-code \
            "$base" HEAD -- 'rust/crates/wire/*host-api-*.json'

      - run: cargo fmt --check
        working-directory: rust

      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: rust

      - run: cargo test --locked
        working-directory: rust

  # The restart rule of the daemon units: bin/systemd-proof.sh. A unit with
  # `RestartPreventExitStatus=78` must stay stopped after exit status 78, and
  # only systemd can prove that. The script makes three units of its own on
  # the systemd of the runner, as root. It then gives each unit file under
  # systemd/ to `systemd-analyze verify`. The runner must run systemd as its
  # first process, and its sudo must not ask for a password.
  #
  # The job runs on every code change, and on a change that touches no file
  # of the proof its one step after the checkout is skipped (`--unchanged`
  # of the script). The job is then a success: a job skipped as a whole on a
  # code change reads as red in the verdict. The files of the proof are
  # systemd/ and the script.
  #
  # The step asks `!= 'false'`, not `== 'true'`: an answer that is missing
  # runs the proof.
  #
  # No `container:` key: a container has no systemd as process 1. On a
  # machine without one of the two the script fails. It does not skip.
  #
  # The time limit: a job has 6 hours by default, and the proof needs minutes.
  systemd-proof:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: bin/systemd-proof.sh
        if: needs.scope.outputs.systemd != 'false'

  # The KVM smoke job (decisions CH8-4, CH36 G19 and G20). It runs each
  # test whose name holds `kvm_` and that is `#[ignore]`d, in any crate of
  # rust/, so a new kvm_ test needs no edit here. bin/vm-smoke-setup.sh
  # first opens /dev/kvm and /dev/vhost-vsock with the runner's own sudo,
  # starts the user manager, fetches the guest kernel by its digest (fact
  # 53) and busybox from apt. It installs the toolchain and the musl
  # target, builds guest-init and builds the test programs. The method is
  # the one the C0 spike proved (fact 79).
  #
  # CH and ch-remote: the script builds both on every run, with the CH7-4
  # argv at the rev of fact 78 and no cache (decision CH75). The build
  # starts first and runs in the background of the same script, beside
  # the rest of the setup and the build of the test programs. The script
  # waits for it before it ends, so each test runs the built CH. A second
  # job for the build would hand its programs to this job only at its end,
  # so the rest of the setup would wait for the whole build.
  #
  # No KVM on the runner fails the job. It never skips: a job skipped on a
  # code change reads as red in the verdict.
  #
  # The base disk: the script also builds the base flavor disk from the
  # tree of the run in the background, beside the CH build, so the real
  # facade test of rust/crates/vmm/tests/kvm_facade.rs boots the facade of
  # this change (decisions CH75 rule 2, CH80). It needs no step here.
  #
  # The time limit: the CH build takes about 6 minutes, with a limit of 12
  # minutes in the script. The rest of the setup, the base disk build
  # (about 80 s, 8 minutes for each of its steps at most) and the build of
  # the tests run beside it. The tests take about 2 minutes after it, and
  # the real facade test adds about 1.5 to 2 minutes, so the job takes
  # about 12 to 12.5 of its 25 minutes.
  kvm:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: bin/vm-smoke-setup.sh
        env:
          CRECHE_KVM_DIR: ${{ runner.temp }}/kvm

      - name: toolchain
        working-directory: rust
        run: |
          rustup toolchain install --no-self-update
          cargo --version

      # `cargo test` exits 0 when the filter matches no test. So a renamed
      # test, a lost `#[ignore]` or a wrong cfg would leave the job green
      # with no boot. This step fails when no ignored kvm_ test exists.
      - name: count the kvm tests
        working-directory: rust
        run: |
          count=$(cargo test --locked -q -- --ignored --list kvm_ | grep -c ': test$' || true)
          echo "ignored kvm_ tests: $count"
          test "$count" -ge 1

      # `--no-fail-fast` runs every test binary, so one red binary does
      # not hide the result of the next one.
      - run: cargo test --locked --no-fail-fast -- --ignored kvm_
        working-directory: rust
        env:
          CRECHE_KVM_DIR: ${{ runner.temp }}/kvm

  # The vmm archive, built as the `artifacts` job of release.yml builds it,
  # and signed by no one (decision CH76 rule 4). The release builds the
  # archive only after the merge, so a broken build would fail the release
  # run and mint no vmm tag. This job fails the PR first. It runs
  # bin/build-artifacts.sh for the planned row `vmm`, with no step that the
  # `artifacts` job lacks. Its first run showed that the CH build needs
  # musl-tools: ring v0.17.14 compiles C with x86_64-linux-musl-gcc (plan
  # risk 13). Both jobs install it from apt before the build, as
  # bin/vm-smoke-setup.sh does, with runner sudo (CH36 G20). The script
  # runs `handover check-tree` and holds the archive to the limits of its
  # row. The last step holds guest-init of the archive static, with the
  # check of step 7 of bin/vm-smoke-setup.sh: no PT_INTERP header, after a
  # proof that the check refuses the dynamic /bin/bash of the runner.
  # guest-init runs as the init of a guest that has no program interpreter.
  #
  # It runs on every code change, and on a change that touches no file of
  # the vmm build its steps after the checkout are skipped, as in the
  # `systemd-proof` job. The files of the build are the `vmm` answer of the
  # scope. No job uploads the archive, and no job signs it.
  #
  # The time limit: the CH build took 131 to 152 s in the kvm job (fact
  # 83), and the vmm and guest-init build after it. The `artifacts` job has
  # the same 30 minutes.
  vmm-archive:
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: needs.scope.outputs.vmm != 'false'
        with:
          enable-cache: false

      # musl-gcc for the C of ring under CH (plan risk 13). The `artifacts`
      # job of release.yml holds the same step.
      - name: musl-tools
        if: needs.scope.outputs.vmm != 'false'
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends -qq musl-tools

      - name: build
        if: needs.scope.outputs.vmm != 'false'
        env:
          ARTIFACT_REPO: creche
          ARTIFACT_PLANNED: vmm
          ARTIFACT_OUT: ${{ runner.temp }}/artifacts
        run: bin/build-artifacts.sh

      - name: static guest-init
        if: needs.scope.outputs.vmm != 'false'
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/artifacts/vmm-x86_64-unknown-linux-musl.tar.gz
          TREE: ${{ runner.temp }}/vmm-tree
        run: |
          set -euo pipefail
          interp='^[[:space:]]+INTERP[[:space:]]'
          if ! readelf -lW /bin/bash | grep -Eq "$interp"; then
            echo "the static check is broken: it passes the dynamic /bin/bash" >&2
            exit 1
          fi
          mkdir -- "$TREE"
          tar --extract --gzip --file "$ARCHIVE" --directory "$TREE"
          headers=$(readelf -lW "$TREE/vmm/bin/guest-init")
          if grep -Eq "$interp" <<< "$headers"; then
            echo "guest-init names a program interpreter: it is not static" >&2
            exit 1
          fi
          echo "guest-init of the vmm archive is static"

  # The one check a session reads. `always()`: a job that needs a failed job
  # is skipped by default, and a skipped `gate` would not read as red.
  gate:
    needs: [scope, lint, tests, agent, facade, proc, suites, memory, playpen-image, rust, systemd-proof, kvm, vmm-archive]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # The verdict is a local action, read from the checkout. Full history
      # as in every job (bin/tests/test_gate_workflow.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: every job passed
        uses: ./.github/actions/verdict
        with:
          needs: ${{ toJSON(needs) }}
