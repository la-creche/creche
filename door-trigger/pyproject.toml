[project]
name = "agent-door-trigger"
version = "0.1.0"
description = "Trigger front door: timers and webhooks start sessions (contract 02)."
requires-python = ">=3.12"
dependencies = ["agent-family", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
agent-trigger = "agent_door_trigger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_door_trigger"]

[tool.uv.sources]
agent-family = { workspace = true }

[tool.uv]
# uv rebuilds a local package only when pyproject.toml, setup.py or setup.cfg
# changes, and every first-party package stays at one version. Without the
# source in the key, a non-editable build installs the FIRST wheel uv ever
# cached for this directory, for ever, so a new commit's tree runs old code
# (handover/tests/test_handover_ced_uv_guard.py).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
